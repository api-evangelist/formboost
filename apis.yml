name: Formboost
description: >-
  Form-backend-as-a-service with a single unauthenticated HTTP POST submission endpoint for any frontend or static site.
  Submissions land in an inbox and searchable dashboard and can fan out to Google Sheets, email, Slack, Discord,
  Telegram, Zapier, n8n, and webhooks. No backend code, server, or database required.
